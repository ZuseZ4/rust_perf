[package]
name = "rust_perf"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
#path = "src/lib.rs"

[dependencies]
libc = { version = "0.2.175", default-features = false }
rustc_offload_frontend = { path = "crates/rustc_offload_frontend" }

[features]
default = []

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.dev]
lto = "fat"
panic = "abort"

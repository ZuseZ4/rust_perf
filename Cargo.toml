cargo-features = ["panic-immediate-abort"]

[package]
name = "rust_perf"
version = "0.1.0"
edition = "2024"

# The device pass compiles the lib; the host passes build the bin from the same source so the
# result is a runnable executable (rustc links the device image itself now, no linker-wrapper).
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "rust_perf"
path = "src/lib.rs"

[dependencies]
libc = { version = "0.2.175", default-features = false }
rustc_offload_frontend = { path = "crates/rustc_offload_frontend" }

[profile.release]
lto = "fat"
panic = "immediate-abort"
codegen-units = 1

[profile.dev]
lto = "fat"
panic = "immediate-abort"


[features]
default = ["all", "f64"]
all = [
    "energy",
    "fir",
    "del_dot_vec_2d",
    "mass3dea",
    "convection3pda",
    "diffusion3dpa",
    "ltimes",
    "mass3dpa",
    "massvec3dpa",
    "matvec_3d_stencil",
    "pressure",
    "vol3d",
]
energy = []
fir = []
del_dot_vec_2d = []
mass3dea = []
convection3pda = []
diffusion3dpa = []
ltimes = []
mass3dpa = []
massvec3dpa = []
matvec_3d_stencil = []
pressure = []
vol3d = []
f64 = []
a64 = []
async_launch = []

